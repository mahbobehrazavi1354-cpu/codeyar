name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Create Capacitor project
        run: |
          mkdir -p www
          if [ ! -f www/index.html ]; then f=$(ls index*.html 2>/dev/null | head -1); if [ -n "$f" ]; then cp "$f" www/index.html; fi; fi
          ic=$(ls icon*.png 2>/dev/null | head -1)
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/filesystem@7 @capacitor/share@7 @capacitor/clipboard@7
          npx cap init CodeYar com.codeyar.app --web-dir www
          node -e "const fs=require('fs');const f=fs.existsSync('capacitor.config.json')?'capacitor.config.json':null;if(f){const c=JSON.parse(fs.readFileSync(f));c.android=Object.assign({},c.android,{adjustMarginsForEdgeToEdge:'auto'});fs.writeFileSync(f,JSON.stringify(c,null,2))}" || true
          npx cap add android
          if [ -n "$ic" ]; then
            mkdir -p assets
            cp "$ic" assets/icon-only.png
            npm install --save-dev @capacitor/assets@3
            npx capacitor-assets generate --android --iconBackgroundColor '#0f1720' --iconBackgroundColorDark '#0f1720' || true
          fi
          npx cap sync android
          sed -i 's|<application|<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />\n    <application|' android/app/src/main/AndroidManifest.xml || true

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: CodeYar-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
