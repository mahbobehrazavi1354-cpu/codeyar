<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<title>CodeYar</title>
<style>
:root{--bg:#0f1720;--panel:#17212c;--line:#263444;--tx:#dfe7ee;--mut:#8497a8;--ok:#3ddc97;--html:#ff8a5c;--css:#5cb8ff;--js:#ffd04d;--bad:#ff6b6b}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#app{height:100dvh;display:flex;flex-direction:column;overflow:hidden}
header,nav,.eb,#status,.bar{flex:none}
header{display:flex;align-items:center;gap:5px;padding:7px 8px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:16px;flex:1;font-weight:700}
.ib{background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px}
.ib:active{background:var(--line)}
.run{background:var(--ok);color:#06281a;border-color:var(--ok);font-weight:700}
nav{display:flex;background:var(--panel)}
nav button{flex:1;padding:10px 0;background:none;border:0;border-bottom:3px solid transparent;color:var(--mut);font-size:14px;font-weight:700;font-family:ui-monospace,Menlo,monospace}
nav button.on{color:var(--tx)}
nav button[data-t=html].on{border-color:var(--html)}
nav button[data-t=css].on{border-color:var(--css)}
nav button[data-t=js].on{border-color:var(--js)}
.eb{display:flex;gap:5px;padding:6px 8px;background:var(--panel);border-bottom:1px solid var(--line)}
.eb .chip{flex:1;padding:8px 2px;font:700 12.5px system-ui,sans-serif;text-align:center}
#wrap{flex:1 1 0;display:flex;min-height:0;direction:ltr}
#gut{width:42px;flex:none;padding:12px 8px 70px 0;text-align:right;color:#4d6074;font:15px/1.55 ui-monospace,Menlo,Consolas,monospace;white-space:pre;overflow:hidden;user-select:none;-webkit-user-select:none;border-right:1px solid var(--line)}
#gut b{color:var(--bad);font-weight:700}
#ed{flex:1;min-width:0;height:100%;direction:ltr;text-align:left;background:var(--bg);color:var(--tx);border:0;outline:0;resize:none;padding:12px 12px 70px;font:15px/1.55 ui-monospace,Menlo,Consolas,monospace;tab-size:2;white-space:pre;overflow:auto}
#status{display:flex;gap:10px;align-items:flex-start;padding:6px 10px;font-size:12.5px;line-height:1.5;background:var(--panel);border-top:1px solid var(--line)}
#stx{flex:1;overflow-wrap:anywhere}
#status.ok #stx{color:var(--ok)}
#status.err #stx{color:var(--bad)}
#status.warn #stx{color:var(--js)}
#pos{color:var(--mut);white-space:nowrap;direction:ltr}
.bar{display:flex;gap:6px;overflow-x:auto;padding:7px 8px;background:var(--panel);border-top:1px solid var(--line);direction:ltr;scrollbar-width:none;min-height:50px;align-items:center}
#keys{padding-bottom:calc(7px + env(safe-area-inset-bottom,0px))}
.bar::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 14px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font:700 14px ui-monospace,Menlo,monospace}
.chip:active{background:var(--ok);color:#06281a}
#sug .chip{border-color:var(--ok);color:var(--ok)}
#sug .chip:active{color:#06281a}
#sug .chip.all{border-color:var(--css);color:var(--css);padding:9px 11px}
.lab{flex:none;color:var(--mut);font:12px system-ui,sans-serif;padding:0 4px;white-space:nowrap}
.hint{color:var(--mut);font-size:13px;padding:9px 4px;white-space:nowrap}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;z-index:5}
.sheet.show{display:flex}
.card{width:100%;max-height:80dvh;overflow:auto;background:var(--panel);border-radius:18px 18px 0 0;padding:14px}
.card h2{font-size:15px;margin-bottom:10px}
.tp{display:block;width:100%;text-align:start;margin-bottom:8px;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font-size:15px}
.tp:active{border-color:var(--ok)}
.tp small{display:block;color:var(--mut);margin-top:3px;font-size:12px;direction:ltr;text-align:left}
.fi{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font-size:15px;margin-bottom:8px;direction:ltr}
.row{display:block;width:100%;direction:ltr;text-align:left;padding:10px 12px;margin-bottom:5px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font:14px ui-monospace,Menlo,monospace}
.row:active{border-color:var(--ok)}
#pv{position:fixed;inset:0;background:#fff;display:none;flex-direction:column;z-index:9}
#pv.show{display:flex}
#pv .top{display:flex;padding:8px;background:var(--panel)}
#pvErr{display:none;padding:9px 12px;background:var(--bad);color:#fff;font-size:13px;line-height:1.5}
#pv iframe{flex:1;border:0;background:#fff}
#toast{position:fixed;bottom:150px;left:50%;transform:translateX(-50%);background:var(--ok);color:#06281a;padding:8px 16px;border-radius:20px;font-weight:700;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;max-width:90%;text-align:center}
#toast.on{opacity:1}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>CodeYar</h1>
    <button class="ib" id="bLang">EN</button>
    <button class="ib" id="bTpl"></button>
    <button class="ib" id="bChk"></button>
    <button class="ib run" id="bRun"></button>
  </header>
  <nav>
    <button data-t="html">HTML</button>
    <button data-t="css">CSS</button>
    <button data-t="js">JS</button>
  </nav>
  <div class="eb" id="eb"></div>
  <div id="wrap"><div id="gut"></div><textarea id="ed" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off"></textarea></div>
  <div id="status" class="ok"><span id="stx"></span><span id="pos"></span></div>
  <div class="bar" id="sug"></div>
  <div class="bar" id="keys"></div>
</div>

<div class="sheet" id="sheet"><div class="card" id="card"></div></div>
<div id="pv"><div class="top"><button class="ib" id="bClose"></button></div><div id="pvErr"></div><iframe id="fr" sandbox="allow-scripts allow-forms allow-modals"></iframe></div>
<div id="toast"></div>

    const url=URL.createObjectURL(new Blob([src],{type:'text/javascript'}));
    const s=document.createElement('script');let done=false;
    const fin=r=>{if(done)return;done=true;window.removeEventListener('error',onerr,true);clearTimeout(tm);URL.revokeObjectURL(url);s.remove();res(r)};
    const onerr=ev=>{
      if(ev.filename!==url)return;
      ev.preventDefault();
      const raw=String(ev.message||'').replace(/^Uncaught\s*/,'').replace(/^SyntaxError:\s*/,'');
      let line=ev.lineno||1,col=ev.colno||1;
      if(line===1)col=Math.max(1,col-12);
      let off=offOf(code,line,col),msg=trJS(raw);
      if(/Unexpected end of input|Invalid or unexpected token/.test(raw)){const b=scanBr(code,'js');if(b){off=b.off;msg=b.msg}}
      fin({off,msg});
    };
    const tm=setTimeout(()=>fin(null),1500);
    window.addEventListener('error',onerr,true);
    s.onload=()=>fin(null);
    s.onerror=()=>fin(scanBr(code,'js'));
    s.src=url;document.head.appendChild(s);
  });
}
function checkDecl(src,a,z){
  const seg=src.slice(a,z);if(!seg.trim())return null;
  const off=a+(seg.length-seg.trimStart().length);
  const ci=seg.indexOf(':');
  if(ci<0)return{off,msg:E('بین ویژگی و مقدار «:» جا افتاده (مثال: color: red;)','Missing ":" between property and value (e.g. color: red;)')};
  let pos=a,cnt=0,first=-1;
  for(const line of seg.split('\n')){
    if(/^\s*[-\w]+\s*:/.test(line)){cnt++;if(first<0)first=pos+line.trimEnd().length}
    pos+=line.length+1;
  }
  if(cnt>1)return{off:first,msg:E('در انتهای این خط «;» جا افتاده','Missing ";" at the end of this line')};
  const prop=seg.slice(0,ci).trim();
  if(prop.startsWith('-'))return null;
  if(!/^[a-zA-Z][\w-]*$/.test(prop))return{off,msg:E('نام ویژگی «'+prop+'» نامعتبر است','Invalid property name "'+prop+'"')};
  if(!CSS.supports(prop,'initial'))return{off,msg:E('ویژگی «'+prop+'» وجود ندارد','Unknown property "'+prop+'"')};
  const rawVal=seg.slice(ci+1),val=rawVal.replace(/!\s*important/i,'').trim();
  const voff=a+ci+1+(rawVal.length-rawVal.trimStart().length);
  if(!val)return{off:a+ci,msg:E('مقدار «'+prop+'» خالی است','The value of "'+prop+'" is empty')};
  if(!CSS.supports(prop,val)){
    const hint=/^[0-9a-fA-F]{3,8}$/.test(val)?E(' (شاید # جا افتاده؟)',' (missing #?)'):E('','');
    return{off:voff,warn:true,msg:E('مقدار «'+val+'» برای '+prop+' معتبر نیست'+hint.fa,'Invalid value "'+val+'" for '+prop+hint.en)};
  }
  return null;
}
function walkDecls(src,a,z){
  let b=a,pd=0;
  for(let i=a;i<z;i++){
    const c=src[i];
    if(c==='"'||c==="'"){let j=i+1;while(j<z&&src[j]!==c){if(src[j]==='\\')j++;j++}i=j;continue}
    if(c==='(')pd++;
    else if(c===')'){if(pd)pd--}
    else if(c===';'&&!pd){const e=checkDecl(src,b,i);if(e)return e;b=i+1}
  }
  return checkDecl(src,b,z);
}
function chkCSS(code){
  const r=scanBr(code,'css');if(r)return r;
  const clean=code.replace(/\/\*[\s\S]*?\*\//g,m=>m.replace(/[^\n]/g,' '));
  const n=clean.length,st=[];let b=0,pd=0;
  const isGroup=s=>/^@(media|supports|layer|container|document|keyframes|-webkit-keyframes)/i.test(s);
  const test=(a,z)=>{const top=st[st.length-1];if(!top||top.skip)return null;return checkDecl(clean,a,z)};
  for(let i=0;i<n;i++){
    const c=clean[i];
    if(c==='"'||c==="'"){let j=i+1;while(j<n&&clean[j]!==c){if(clean[j]==='\\')j++;j++}i=j;continue}
    if(c==='(')pd++;
    else if(c===')'){if(pd>0)pd--}
    else if(pd>0)continue;
    else if(c==='{'){const sel=clean.slice(b,i).trim();st.push({skip:isGroup(sel)||sel.startsWith('@')});b=i+1}
    else if(c===';'){const e=test(b,i);if(e)return e;b=i+1}
    else if(c==='}'){const e=test(b,i);if(e)return e;st.pop();b=i+1}
  }
  return null;
}
const ATTRRE=/([^\s"'=<>\/]+)(?:\s*=\s*(?:"([^"]*)"|'([^']*)'|([^\s"'=<>`]+)))?/g;
function chkHTML(code){
  const n=code.length,low=code.toLowerCase(),st=[],styles=[],blocks=[];let warn=null,i=0;
  const W1=(off,msg)=>{if(!warn)warn={off,warn:true,msg}};
  const re=/<(\/?)([a-zA-Z][\w:-]*)((?:"[^"]*"|'[^']*'|[^'">])*)>/y;
  const R=err=>({err,styles,blocks,warn});
  while(i<n){
    i=code.indexOf('<',i);if(i<0)break;
    if(code.startsWith('<!--',i)){const j=code.indexOf('-->',i+4);if(j<0)return R({off:i,msg:E('توضیح <!-- بسته نشده است (--> لازم است)','Unclosed comment <!-- (needs -->)')});i=j+3;continue}
    if(code[i+1]==='!'||code[i+1]==='?'){const j=code.indexOf('>',i);i=j<0?n:j+1;continue}
    re.lastIndex=i;const m=re.exec(code);
    if(!m){
      if(/[a-zA-Z\/]/.test(code[i+1]||''))return R({off:i,msg:E('تگ ناقص است: «>» یا نقل‌قول بسته نشده','Incomplete tag: missing ">" or a closing quote')});
      i++;continue;
    }
    const close=m[1]==='/',name=m[2].toLowerCase(),tagOff=m.index;i=re.lastIndex;
    if(close){
      let k=st.length-1;while(k>=0&&st[k].name!==name)k--;
      if(k<0)return R({off:tagOff,msg:E('</'+name+'> تگ بازکننده ندارد','</'+name+'> has no opening tag')});
      for(let q=st.length-1;q>k;q--)if(!OPT.has(st[q].name))return R({off:st[q].off,msg:E('<'+st[q].name+'> بسته نشده است','<'+st[q].name+'> is not closed')});
      st.length=k;continue;
    }
    const foreign=st.some(s=>s.name==='svg'||s.name==='math');
    let typeVal=null,hasSrc=false;
    const baseOff=tagOff+1+m[2].length;
    if(!foreign&&!TAGSET.has(name)&&!name.includes('-')&&!name.includes(':'))W1(tagOff+1,E('تگ «'+name+'» وجود ندارد','Unknown tag "'+name+'"'));
    ATTRRE.lastIndex=0;let a;const allowed=allowedAttrs(name);
    while((a=ATTRRE.exec(m[3]))){
      const an=a[1].toLowerCase(),aoff=baseOff+a.index;
      const v=a[2]!==undefined?a[2]:a[3]!==undefined?a[3]:a[4];
      if(an==='type'&&v!==undefined)typeVal=v.toLowerCase();
      if(an==='src')hasSrc=true;
      if(an==='style'&&v!==undefined){const vs=aoff+a[0].length-v.length-(a[4]!==undefined?0:1);styles.push({a:vs,b:vs+v.length})}
      if(!foreign&&TAGSET.has(name)&&!allowed.has(an)&&!/^(data-|aria-|on|xml|xlink|v-|x-|@|:)/.test(an))
        W1(aoff,E('ویژگی «'+an+'» برای <'+name+'> وجود ندارد','Attribute "'+an+'" does not exist on <'+name+'>'));
    }
    if(/\/\s*$/.test(m[3])||VOID.has(name))continue;
    st.push({name,off:tagOff});
    if(RAW.has(name)){
      const j=low.indexOf('</'+name,i);
      if(j<0)return R({off:tagOff,msg:E('<'+name+'> بسته نشده است','<'+name+'> is not closed')});
      if(name==='style'||name==='script'){
        const skip=hasSrc||(name==='script'&&typeVal&&!/javascript|ecmascript/.test(typeVal))||(name==='style'&&typeVal&&typeVal!=='text/css');
        blocks.push({name,a:i,b:j,skip});
      }
      i=j;
    }
  }
  for(let q=st.length-1;q>=0;q--)if(!OPT.has(st[q].name))return R({off:st[q].off,msg:E('<'+st[q].name+'> بسته نشده است','<'+st[q].name+'> is not closed')});
  return R(null);
}

};
const $=s=>document.querySelector(s);

/* ---- screen fit: fixes the bars after coming back from another app ---- */
function fit(){
  const vv=window.visualViewport;

  if(h>200)$('#app').style.height=h+'px';
}
let kt;
function kick(){
  fit();clearInterval(kt);let k=0;
  kt=setInterval(()=>{fit();if(++k>10)clearInterval(kt)},150);
  setTimeout(rebuildBars,60);setTimeout(rebuildBars,400);
}
function rebuildBars(){

}
['resize','focus','pageshow','orientationchange'].forEach(e=>window.addEventListener(e,kick));

/* ---- buttons that keep the keyboard open and ignore scrolling ---- */
function chip(label,fn,cls){
  const b=document.createElement('button');b.className=cls||'chip';b.textContent=label;

}

/* ---- history (undo / redo) ---- */
const H={html:{s:[],i:-1},css:{s:[],i:-1},js:{s:[],i:-1}};
let lastT=0;
function snap(force){
  const h=H[tab],v=ed.value,cur=h.s[h.i];

}
function restore(x){ed.value=x.v;ed.setSelectionRange(x.c,x.c);ed.focus();save();refresh()}

/* ---- editing helpers ---- */
function put(t,start,end,caret,force){
  ed.setRangeText(t,start,end,'end');
  const c=caret==null?start+t.length:start+caret;
  ed.setSelectionRange(c,c);ed.focus();
  snap(force);save();refresh();
}
const OPN={'(':')','[':']','{':'}','"':'"',"'":"'",'`':'`'};
function autoPair(c){
  const p=ed.selectionStart,v=ed.value,nx=v[p],pv=v[p-2];
  const op=(c==='<'&&tab==='html')?'>':OPN[c];
  const isClose=')]}"\'`'.includes(c)||(c==='>'&&tab==='html');
  if(isClose&&nx===c){ed.setRangeText('',p,p+1,'preserve');return}
  if(!op)return;
  if('"\'`'.includes(c)&&(/\w/.test(pv||'')||/\w/.test(nx||'')))return;
  ed.setRangeText(op,p,p,'start');
}
function typeChar(c){
  const s=ed.selectionStart,e=ed.selectionEnd;
  const op=(c==='<'&&tab==='html')?'>':OPN[c];
  if(s!==e&&op){put(c+ed.value.slice(s,e)+op,s,e,null,true);return}
  ed.setRangeText(c,s,e,'end');
  autoPair(c);
  ed.focus();snap(true);save();refresh();
}
function enter(){
  const s=ed.selectionStart,e=ed.selectionEnd,v=ed.value,bf=v.slice(0,s);
  const indent=bf.slice(bf.lastIndexOf('\n')+1).match(/^[ \t]*/)[0];
  const p=v[s-1],n=v[e],pair={'{':'}','(':')','[':']'};
  if(pair[p]&&n===pair[p]){put('\n'+indent+'  \n'+indent,s,e,1+indent.length+2);return}
  if(tab==='html'&&p==='>'&&v.slice(e,e+2)==='</'){put('\n'+indent+'  \n'+indent,s,e,1+indent.length+2);return}
  if(pair[p]){put('\n'+indent+'  ',s,e);return}

}
async function clip(t){
  const P=CAP();
  if(P&&P.Clipboard){try{await P.Clipboard.write({string:t});return true}catch(e){}}

    const ta=document.createElement('textarea');ta.value=t;ta.style.cssText='position:fixed;opacity:0';
    document.body.appendChild(ta);ta.select();let ok=false;
    try{ok=document.execCommand('copy')}catch(_){}

  }
}
function doAll(){ed.focus();ed.select()}
async function doCopy(){const s=ed.selectionStart,e=ed.selectionEnd;const ok=await clip(s!==e?ed.value.slice(s,e):ed.value);toast(ok?T[lang].copied:T[lang].copyFail)}
async function doCut(){
  let s=ed.selectionStart,e=ed.selectionEnd;const v=ed.value;
  if(s===e){s=v.lastIndexOf('\n',s-1)+1;const j=v.indexOf('\n',e);e=j<0?v.length:j+1}

}
function doPaste(){
  const s=ed.selectionStart,e=ed.selectionEnd;

  if(P&&P.Clipboard){P.Clipboard.read().then(r=>{if(r&&r.value)put(r.value,s,e,null,true);else toast(T[lang].pasteFail)}).catch(()=>toast(T[lang].pasteFail));return}

/* ---- saving files to the phone (Ctrl+S, Save button) ---- */
const CAP=()=>(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform())?window.Capacitor.Plugins:null;
const DEF_NAME={html:'index.html',css:'style.css',js:'script.js'};
const getName=t=>localStorage['cy_name_'+t]||DEF_NAME[t];
function browserDownload(name,text){
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));
  a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);
  return {ok:true,where:name};
}
async function shareFile(name,text){
  const P=CAP();

    const r=await P.Filesystem.writeFile({path:name,data:text,directory:'CACHE',encoding:'utf8'});
    await P.Share.share({title:name,url:r.uri,dialogTitle:name});
    return {ok:true,where:'share'};
  }
  return browserDownload(name,text);
}
async function saveFile(name,text){
  const P=CAP();
  if(!(P&&P.Filesystem))return browserDownload(name,text);
  const opts={path:'CodeYar/'+name,data:text,directory:'DOCUMENTS',encoding:'utf8',recursive:true};
  try{await P.Filesystem.writeFile(opts);return {ok:true,where:'Documents/CodeYar/'+name}}catch(e){}
  try{if(P.Filesystem.requestPermissions)await P.Filesystem.requestPermissions();await P.Filesystem.writeFile(opts);return {ok:true,where:'Documents/CodeYar/'+name}}catch(e){}
  try{return await shareFile(name,text)}catch(e){return {ok:false}}
}
function contentOf(t){return t===tab?ed.value:g('cy_'+t,'')}
async function doSave(){
  save();const name=getName(tab);

}

  save();

  const inp=document.createElement('input');inp.className='fi';inp.value=getName(tab);card.appendChild(inp);
  const mk=(txt,fn)=>{const b=document.createElement('button');b.className='tp';b.textContent=txt;b.onclick=fn;card.appendChild(b)};

    $('#sheet').classList.remove('show');

  });

    const name=(inp.value||'').trim()||DEF_NAME[tab];localStorage['cy_name_'+tab]=name;
    $('#sheet').classList.remove('show');

  });

    localStorage['cy_name_'+tab]=(inp.value||'').trim()||DEF_NAME[tab];
    $('#sheet').classList.remove('show');
    const out=[];

  });

document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key&&e.key.toLowerCase()==='s'&&document.activeElement!==ed){e.preventDefault();doSave()}});

/* ---- line / column ---- */
function lc(code,off){const b=code.slice(0,off);return{l:b.split('\n').length,c:off-b.lastIndexOf('\n')}}
function updatePos(){const p=lc(ed.value,ed.selectionStart);$('#pos').textContent=T[lang].ln+p.l+T[lang].col+p.c}
let gn=0,errLine=0;
function renderGut(force){
  const n=ed.value.split('\n').length;
  if(!force&&n===gn)return;
  gn=n;let s='';
  for(let i=1;i<=n;i++)s+=(i===errLine?'<b>'+i+'</b>':i)+'\n';
  gut.innerHTML=s;gut.scrollTop=ed.scrollTop;
}
ed.addEventListener('scroll',()=>{gut.scrollTop=ed.scrollTop});

/* ---- error checking ---- */
let chkTimer,lastR=null;
function schedCheck(){clearTimeout(chkTimer);chkTimer=setTimeout(runCheck,700)}
async function runCheck(){
  const code=ed.value,t=tab;let r=null;
  try{
    if(code.trim()){
      if(t==='css')r=chkCSS(code);
      else if(t==='js')r=await chkJS(code);
      else{
        const h=chkHTML(code);r=h.err;
        if(!r)for(const s of h.styles){r=walkDecls(code,s.a,s.b);if(r)break}
        if(!r)for(const b of h.blocks){if(b.name==='style'&&!b.skip){const e=chkCSS(code.slice(b.a,b.b));if(e){e.off+=b.a;r=e;break}}}
        if(!r)for(const b of h.blocks){if(b.name==='script'&&!b.skip){const e=await chkJS(code.slice(b.a,b.b));if(e){e.off+=b.a;r=e;break}}}
        if(!r)r=h.warn;
      }
    }
  }catch(e){r=null}
  if(ed.value!==code||tab!==t)return;
  show(r,!code.trim());
  return r;
}
function show(r,empty){
  lastR=r;const el=$('#status'),tx=$('#stx');
  if(!r){el.className='ok';tx.textContent=empty?T[lang].empty:T[lang].ok;markLine(0);return}
  const p=lc(ed.value,r.off);
  el.className=r.warn?'warn':'err';
  tx.textContent='⚠ '+T[lang].ln+p.l+T[lang].col+p.c+': '+msgOf(r.msg);
  markLine(p.l);
}
function markLine(l){if(errLine!==l){errLine=l;renderGut(true)}}
function jumpTo(off){
  ed.focus();ed.setSelectionRange(off,Math.min(off+1,ed.value.length));
  const lh=parseFloat(getComputedStyle(ed).lineHeight)||23;
  ed.scrollTop=Math.max(0,(lc(ed.value,off).l-4)*lh);
  gut.scrollTop=ed.scrollTop;updatePos();
}
$('#status').addEventListener('click',()=>{if(lastR)jumpTo(lastR.off)});

/* ---- suggestions ---- */
let curCtx=null;
function filterItems(items,word){
  const w=(word||'').toLowerCase();
  let r=items;
  if(w){
    r=items.filter(i=>(i.f||i.l).toLowerCase().startsWith(w));
    if(r.length<3)r=items.filter(i=>(i.f||i.l).toLowerCase().includes(w));
  }
  return r.map(i=>({i,sc:i.s+(use[i.k+':'+i.l]||0)*8})).sort((a,b)=>b.sc-a.sc).map(x=>x.i);
}
function suggest(){
  const box=$('#sug');box.innerHTML='';
  const env={html:tab==='html'?ed.value:g('cy_html',''),css:tab==='css'?ed.value:g('cy_css',''),after:ed.value[ed.selectionStart]||''};
  let c=null;
  try{c=suggestCtx(tab,ed.value,ed.selectionStart,env)}catch(e){c=null}
  curCtx=c;
  if(!c||!c.items.length){box.innerHTML='<span class="hint">'+T[lang].none+'</span>';return}
  const lab=document.createElement('span');lab.className='lab';lab.textContent=msgOf(c.title);box.appendChild(lab);
  box.appendChild(chip('☰',openAll,'chip all'));
  const list=filterItems(c.items,c.word).slice(0,40);
  if(!list.length){const h=document.createElement('span');h.className='hint';h.textContent=T[lang].none;box.appendChild(h);return}
  list.forEach(it=>box.appendChild(chip(it.d||it.l,()=>applyItem(it,c))));
}
function applyItem(it,c){
  c=c||curCtx;if(!c)return;
  const bf=ed.value.slice(0,c.start);
  const indent=bf.slice(bf.lastIndexOf('\n')+1).match(/^[ \t]*/)[0];
  let t=it.t.split('\n').join('\n'+indent);
  const ci=t.indexOf('$0');if(ci>=0)t=t.replace('$0','');
  put(t,c.start,Math.max(c.end,c.start),ci<0?null:ci,true);
  use[it.k+':'+it.l]=(use[it.k+':'+it.l]||0)+1;localStorage.cy_use=JSON.stringify(use);
}
function openAll(){
  const c=curCtx;if(!c)return;
  const card=$('#card');card.innerHTML='';
  const h=document.createElement('h2');h.textContent=T[lang].allTitle+' · '+msgOf(c.title);card.appendChild(h);
  const inp=document.createElement('input');inp.className='fi';inp.placeholder=T[lang].search;inp.value=c.word||'';card.appendChild(inp);
  const box=document.createElement('div');card.appendChild(box);
  const sorted=c.items.slice().sort((a,b)=>(a.f||a.l).localeCompare(b.f||b.l));
  function draw(){
    const w=inp.value.toLowerCase();box.innerHTML='';
    let r=sorted;
    if(w){r=sorted.filter(i=>(i.f||i.l).toLowerCase().startsWith(w));const r2=sorted.filter(i=>!r.includes(i)&&(i.f||i.l).toLowerCase().includes(w));r=r.concat(r2)}
    r.slice(0,300).forEach(it=>{
      const b=document.createElement('button');b.className='row';b.textContent=it.d||it.l;
      b.onclick=()=>{$('#sheet').classList.remove('show');applyItem(it,c)};
      box.appendChild(b);
    });
  }
  inp.addEventListener('input',draw);draw();
  $('#sheet').classList.add('show');
}
function refresh(){suggest();updatePos();renderGut(false);schedCheck()}

/* ---- UI build ---- */
function buildEdit(){
  const t=T[lang],eb=$('#eb');eb.innerHTML='';
  [[t.undo,doUndo],[t.redo,doRedo],[t.all,doAll],[t.copy,doCopy],[t.cutB,doCut],[t.paste,doPaste],[t.save,openSave]].forEach(a=>eb.appendChild(chip(a[0],a[1])));
}
const KEYS=['Tab','<','>','/','{','}','(',')','[',']',';',':','=','"',"'",'`','$','#','.','!','&','|','+','-','*','_','?',',','%','@'];
function buildKeys(){
  const k=$('#keys');k.innerHTML='';
  KEYS.forEach(c=>k.appendChild(chip(c,()=>{if(c==='Tab')put('  ',ed.selectionStart,ed.selectionEnd,null);else typeChar(c)})));
}
function applyLang(){
  const t=T[lang];
  document.documentElement.lang=lang;document.documentElement.dir=lang==='fa'?'rtl':'ltr';
  $('#bLang').textContent=lang==='fa'?'EN':'FA';
  $('#bTpl').textContent=t.tpl;$('#bChk').textContent=t.chk;$('#bRun').textContent=t.run;$('#bClose').textContent=t.close;
  buildEdit();show(lastR,!ed.value.trim());updatePos();suggest();
}
function setTab(t){
  if(ed.dataset.ready)save();
  ed.dataset.ready=1;tab=t;localStorage.cy_tab=t;
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  ed.value=g('cy_'+t,'');ed.scrollTop=0;
  snap(true);show(null,!ed.value.trim());renderGut(true);refresh();
}

/* ---- templates ---- */
function openTpl(){
  const t=T[lang],card=$('#card');
  card.innerHTML='<h2>'+t.tplTitle+' · '+tab.toUpperCase()+'</h2>';
  TP[tab].map((x,i)=>({x,i,sc:x[3]+(use['tp'+tab+i]||0)*3})).sort((a,b)=>b.sc-a.sc).forEach(o=>{
    const b=document.createElement('button');b.className='tp';
    b.textContent=lang==='fa'?o.x[0]:o.x[1];
    const sm=document.createElement('small');sm.textContent=o.x[2].split('\n')[0];b.appendChild(sm);
    b.onclick=()=>{
      put(o.x[2],ed.selectionStart,ed.selectionEnd,null,true);
      use['tp'+tab+o.i]=(use['tp'+tab+o.i]||0)+1;localStorage.cy_use=JSON.stringify(use);
      $('#sheet').classList.remove('show');
    };
    card.appendChild(b);
  });
  $('#sheet').classList.add('show');
}
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')e.target.classList.remove('show')});
$('#bTpl').onclick=openTpl;

/* ---- run preview (links to CSS/JS files use the CSS/JS tabs) ---- */
let pvBase=0,pvErr=null;
$('#bRun').onclick=()=>{
  save();pvErr=null;$('#pvErr').style.display='none';
  let html=g('cy_html',''),css=g('cy_css',''),js=g('cy_js','');
  let used=false;
  html=html.replace(/<link\b[^>]*rel\s*=\s*["']?stylesheet["']?[^>]*>/gi,m=>{
    const h=/href\s*=\s*["']?([^"'\s>]+)/i.exec(m);
    if(h&&!/^(https?:)?\/\//i.test(h[1])){if(used)return '';used=true;return '<style>'+css+'</style>'}
    return m;
  });
  if(!used)html+='\n<style>'+css+'</style>';
  html=html.replace(/<script\b[^>]*\bsrc\s*=\s*["']?(?!https?:|\/\/)[^"'\s>]+["']?[^>]*>\s*<\/script>/gi,'');
  const pre=html+'\n<script>window.addEventListener("error",function(e){parent.postMessage({cy:1,m:e.message,l:e.lineno,c:e.colno},"*")});<\/script>\n<script>\n';
  pvBase=pre.split('\n').length;
  $('#fr').srcdoc=pre+js+'\n<\/script>';
  $('#pv').classList.add('show');
};
$('#bClose').onclick=()=>$('#pv').classList.remove('show');
window.addEventListener('message',ev=>{
  const d=ev.data;
  if(!d||!d.cy||ev.source!==$('#fr').contentWindow||pvErr)return;
  const l=d.l-pvBase+1;pvErr={l,c:d.c};
  const box=$('#pvErr');
  box.textContent='JS · '+T[lang].rt+' · '+T[lang].ln+l+T[lang].col+d.c+': '+d.m+' '+T[lang].goErr;
  box.style.display='block';
});
$('#pvErr').addEventListener('click',()=>{
  if(!pvErr||pvErr.l<1)return;
  $('#pv').classList.remove('show');
  if(tab!=='js')setTab('js');
  jumpTo(offOf(ed.value,pvErr.l,pvErr.c));
});

/* ---- check button, language, tabs ---- */
$('#bChk').onclick=async()=>{
  const r=await runCheck();
  if(r)jumpTo(r.off);else toast(ed.value.trim()?T[lang].ok:T[lang].empty);
};
$('#bLang').onclick=()=>{lang=lang==='fa'?'en':'fa';localStorage.cy_lang=lang;applyLang();suggest()};
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>setTab(b.dataset.t));

/* ---- editor events ---- */
ed.addEventListener('input',e=>{
  if(e.inputType==='insertText'&&e.data&&e.data.length===1&&!e.isComposing)autoPair(e.data);
  snap(false);save();refresh();
});
['keyup','click','focus'].forEach(ev=>ed.addEventListener(ev,()=>{suggest();updatePos()}));
document.addEventListener('selectionchange',()=>{if(document.activeElement===ed)updatePos()});
ed.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey){
    const k=e.key.toLowerCase();
    if(k==='z'){e.preventDefault();e.shiftKey?doRedo():doUndo()}
    else if(k==='y'){e.preventDefault();doRedo()}
    else if(k==='s'){e.preventDefault();doSave()}
    return;
  }
  if(e.key==='Enter'){e.preventDefault();enter()}
  else if(e.key==='Tab'){e.preventDefault();put('  ',ed.selectionStart,ed.selectionEnd,null)}
});
ed.addEventListener('beforeinput',e=>{
  if(e.inputType==='historyUndo'){e.preventDefault();doUndo()}
  else if(e.inputType==='historyRedo'){e.preventDefault();doRedo()}
  else if(e.inputType==='insertLineBreak'||e.inputType==='insertParagraph'){e.preventDefault();enter()}
});

fit();buildKeys();applyLang();setTab(tab);setTimeout(kick,300);
</script>
</body>
</html>
